.grabber { width: 38px; height: 5px; border-radius: 999px; background: var(--text-3); margin: 0 auto 4px; }
.banner { background: var(--amber-bg); color: var(--amber); border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 18px; display: flex; gap: 8px; }

.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--up); }

.stat { background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }

@media (max-height: 720px) { .caption { display: none; } .phone { height: clamp(480px, calc(100dvh - 32px), 844px); } }
/* ── Teléfonos (o ventanas muy bajas y estrechas): la app ocupa toda la pantalla ── */

<script>
(() => {
/* ── Formato español ─────────────────────────────── */
const NF = (d) => new Intl.NumberFormat('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: 'always' })
const n0 = NF(0), n2 = NF(2), n4 = NF(4)
const eur = v => (v < 0 ? '−' : '') + n2.format(Math.abs(v)) + ' €'
const sEur = v => (v >= 0 ? '+' : '−') + n2.format(Math.abs(v)) + ' €'
const pct = v => (v >= 0 ? '▲ +' : '▼ −') + n2.format(Math.abs(v)) + ' %'
const USD_EUR = 0.923
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/* ── Activos de ejemplo ──────────────────────────── */
const ASSETS = [
  { s: 'AAPL', n: 'Apple', type: 'Acciones', ex: 'NASDAQ', cur: 'USD', p: 212.44, c: 0.84, open: true },
  { s: 'NVDA', n: 'NVIDIA', type: 'Acciones', ex: 'NASDAQ', cur: 'USD', p: 131.08, c: 2.40, open: true },
  { s: 'MSFT', n: 'Microsoft', type: 'Acciones', ex: 'NASDAQ', cur: 'USD', p: 417.20, c: 0.52, open: true },
  { s: 'TSLA', n: 'Tesla', type: 'Acciones', ex: 'NASDAQ', cur: 'USD', p: 251.10, c: -1.35, open: true },
  { s: 'ITX', n: 'Inditex', type: 'Acciones', ex: 'BME', cur: 'EUR', p: 52.18, c: 1.05, open: false, delayed: true },
  { s: 'SAN', n: 'Banco Santander', type: 'Acciones', ex: 'BME', cur: 'EUR', p: 4.71, c: -0.42, open: false, delayed: true },
  { s: 'VWCE', n: 'Vanguard FTSE All-World', type: 'ETFs', ex: 'XETRA', cur: 'EUR', p: 128.36, c: 0.22, open: false },
  { s: 'SPY', n: 'S&P 500 ETF', type: 'ETFs', ex: 'NYSE', cur: 'USD', p: 571.30, c: 0.35, open: true },
  { s: 'BTC', n: 'Bitcoin', type: 'Cripto', ex: 'Cripto', cur: 'EUR', p: 61204, c: -1.12, open: true, h24: true },
  { s: 'ETH', n: 'Ethereum', type: 'Cripto', ex: 'Cripto', cur: 'EUR', p: 2380.40, c: 0.67, open: true, h24: true },
  { s: 'IBEX', n: 'IBEX 35', type: 'Índices', ex: 'Índice', cur: 'EUR', p: 11842, c: 0.31, open: false, index: true },
  { s: 'EURUSD', n: 'EUR/USD', type: 'Divisas', ex: 'Divisa', cur: 'USD', p: 1.0842, c: -0.05, open: true, fx: true },
]
const A = Object.fromEntries(ASSETS.map(a => [a.s, a]))
const toEur = a => a.cur === 'USD' && !a.fx ? a.p * USD_EUR : a.p
const fprice = a => a.fx ? n4.format(a.p) : a.index ? n0.format(a.p) : (a.p >= 10000 ? n0.format(a.p) : n2.format(a.p)) + (a.cur === 'USD' ? ' $' : ' €')

/* Serie pseudoaleatoria estable que acaba en `end` */
function series(seed, n, end, vol) {
  let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) % 2147483647
  let v = 100; const out = []
  for (let i = 0; i < n; i++) { s = (s * 16807) % 2147483647; v *= 1 + (s / 2147483647 - .5) * vol; out.push(v) }
  const k = end / out[n - 1]; return out.map(x => x * k)
}
function pathOf(vals, w, h, pad = 3) {
  const mn = Math.min(...vals), mx = Math.max(...vals), k = (mx - mn) || 1
  return vals.map((v, i) => (i ? 'L' : 'M') + (i * w / (vals.length - 1)).toFixed(1) + ' ' + (pad + (h - 2 * pad) * (1 - (v - mn) / k)).toFixed(1)).join(' ')
}
function spark(seed, end, up, w = 56, h = 22) {
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${pathOf(series(seed, 24, end, .03), w, h, 2)}" fill="none" stroke="var(--${up ? 'up' : 'down'})" stroke-width="1.6"/></svg>`
}

/* ── Lumi (la cara la pinta el frontend según el estado de ánimo) ── */
function lumi(mood = 'HAPPY', size = 44) {
  const eyes = {
    HAPPY: '<path d="M15 21q3-4 6 0M27 21q3-4 6 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    CELEBRATE: '<path d="M18 16l1.4 3 3.2.4-2.3 2.2.6 3.2-2.9-1.6-2.9 1.6.6-3.2-2.3-2.2 3.2-.4zM30 16l1.4 3 3.2.4-2.3 2.2.6 3.2-2.9-1.6-2.9 1.6.6-3.2-2.3-2.2 3.2-.4z" fill="#fff"/>',
    WORRIED: '<path d="M14 15l6 3M34 15l-6 3" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="18" cy="22" r="3" fill="#fff"/><circle cx="30" cy="22" r="3" fill="#fff"/>',
    CALM: '<path d="M15 21h6M27 21h6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>',
    SAD: '<circle cx="18" cy="21" r="3" fill="#fff"/><circle cx="30" cy="21" r="3" fill="#fff"/><path d="M14 16l5-2M34 16l-5-2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>',
    SLEEPY: '<path d="M15 21q3 3 6 0M27 21q3 3 6 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
    THINKING: '<circle cx="18" cy="21" r="3" fill="#fff"/><circle cx="31" cy="19" r="3" fill="#fff"/>',

function candleChart(sel = null, correct = null) {
  const W = 300, H = 170, lo = 89, hi = 108, y = v => 10 + (H - 20) * (1 - (v - lo) / (hi - lo))
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gráfico de velas diarias de AAPL, 6 velas">${CANDLES.map(([o, h, l, c], i) => {
    const x = 28 + i * 48, upc = c >= o, col = upc ? 'var(--up)' : 'var(--down)'
    const ring = sel === i ? `<rect x="${x - 16}" y="4" width="32" height="${H - 8}" rx="10" fill="none" stroke="${correct === null ? 'var(--brand)' : correct ? 'var(--up)' : 'var(--down)'}" stroke-width="2"/>` : ''
    return `<g data-candle="${i}" style="cursor:pointer">${ring}<rect x="${x - 18}" y="0" width="36" height="${H}" fill="transparent"/><line x1="${x}" x2="${x}" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="2"/><rect x="${x - 8}" y="${y(Math.max(o, c))}" width="16" height="${Math.max(3, Math.abs(y(o) - y(c)))}" rx="2" fill="${col}"/></g>`
  }).join('')}</svg>`
}

V.asset = () => {
  const a = A[S.asset], p = S.pos[a.s], w = p ? posValue(a.s) / total() * 100 : 0
  const n = { '1m': 60, '5m': 60, '1h': 48, '1d': 60, '1w': 52 }[S.chartInt]
  const vals = series(a.s + S.chartInt, n, a.p, S.chartInt === '1w' ? .05 : S.chartInt === '1d' ? .025 : .006)
  let chart
  if (S.chartMode === 'Línea') {
    const d = pathOf(vals, 340, 170, 6)
    chart = `<svg viewBox="0 0 340 170" preserveAspectRatio="none" style="width:100%;height:170px" role="img" aria-label="Gráfico de ${a.n}"><path d="${d} L340 170 L0 170 Z" fill="color-mix(in srgb, var(--${a.c >= 0 ? 'up' : 'down'}) 10%, transparent)"/><path d="${d}" fill="none" stroke="var(--${a.c >= 0 ? 'up' : 'down'})" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`
  } else {
    const k = 24, slice = vals.slice(-k * 2), mn = Math.min(...slice) * .998, mx = Math.max(...slice) * 1.002, y = v => 6 + 158 * (1 - (v - mn) / (mx - mn))
    let bars = ''
    for (let i = 0; i < k; i++) { const o = slice[i * 2], c = slice[i * 2 + 1], h = Math.max(o, c) * 1.0015, l = Math.min(o, c) * .9985, x = 7 + i * 13.8, col = c >= o ? 'var(--up)' : 'var(--down)'; bars += `<line x1="${x}" x2="${x}" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="1.2"/><rect x="${x - 4}" y="${y(Math.max(o, c))}" width="8" height="${Math.max(2, Math.abs(y(o) - y(c)))}" rx="1.5" fill="${col}"/>` }
    chart = `<svg viewBox="0 0 340 170" style="width:100%;height:170px" role="img" aria-label="Velas de ${a.n}">${bars}</svg>`
  }
  const chgAbs = a.p - a.p / (1 + a.c / 100)
  return `
  ${top('', 'back', `<div class="row" style="gap:0"><button class="link" data-act="follow">${S.watch.includes(a.s) ? '★ Siguiendo' : '☆ Seguir'}</button><button class="link" data-act="alert">Alerta</button></div>`)}
  <div class="scroll"><div class="pad">
    <span class="t-foot">${a.s} · ${status(a)}${a.open && !a.h24 && !a.fx ? ' hasta las 22:00' : ''}</span>

    <span class="big" data-px="${a.s}">${fprice(a)}</span>
    <span class="t-body ${a.c >= 0 ? 'up' : 'down'}" style="font-weight:700;margin-top:-6px" data-chg="${a.s}">${a.c >= 0 ? '▲ +' : '▼ −'}${n2.format(Math.abs(chgAbs))} (${n2.format(Math.abs(a.c))} %) hoy</span>
    ${a.cur === 'USD' && !a.fx ? `<span class="t-foot" style="margin-top:-8px">≈ ${eur(toEur(a))} · en vivo</span>` : ''}
    ${S.stale ? '<div class="banner">Precio de hace 2 min (último conocido). Reconectando…</div>' : ''}
    <div class="card" style="padding:12px 8px 8px">${chart}</div>
    <div class="between"><div class="seg" style="width:130px">${['Línea', 'Velas'].map(m => `<button data-cmode="${m}" aria-pressed="${S.chartMode === m}">${m}</button>`).join('')}</div>
      <div class="seg" style="flex:1;max-width:200px">${['1m', '5m', '1h', '1d', '1w'].map(m => `<button data-cint="${m}" aria-pressed="${S.chartInt === m}" style="padding:0 4px">${m}</button>`).join('')}</div></div>

function preview() {
  const o = S.order, a = A[o.sym], price = toEur(a)
  if (o.side === 'BUY') {
    const amt = o.amount, f = fee(amt), qty = (amt - f) / price
    const newVal = posValue(a.s) + (amt - f), w = newVal / total() * 100
    return { amt, f, qty, price, cashAfter: S.cash - amt, w, flagged: w > 20, insufficient: amt > S.cash }
  }
  const p = S.pos[a.s], qty = p.qty * o.pctSell / 100, gross = qty * price, f = fee(gross)
  return { amt: gross - f, f, qty, price, cashAfter: S.cash + gross - f, w: (posValue(a.s) - gross) / total() * 100, flagged: false }
}

  const o = S.order, a = A[o.sym], pv = preview(), buy = o.side === 'BUY'

    <div class="between"><span class="t-head">${buy ? 'Comprar' : 'Vender'} ${a.s}</span><button class="icon-btn" data-act="close-sheet" aria-label="Cerrar">${ico('close')}</button></div>

    ${buy ? `<div style="text-align:center;padding:6px 0"><div class="big" style="font-size:46px;line-height:52px" id="o-amt">${n0.format(o.amount)} €</div><span class="t-foot" id="o-qty">≈ ${n2.format(pv.qty)} ${a.type === 'Cripto' ? a.s : 'acciones'} a ${eur(pv.price)}</span></div>

/* ── Render ──────────────────────────────────────── */
const $screen = document.getElementById('screen'), $app = document.getElementById('app')
function render(scrollTop) {
  $app.classList.toggle('force-light', S.theme === 'light')
  $app.classList.toggle('force-dark', S.theme === 'dark')
  const prev = $screen.querySelector('.scroll'), y = prev ? prev.scrollTop : 0
  let html = (V[S.screen] || V.home)()
  if (S.sheet === 'order') html += orderSheet()
  if (S.sheet === 'risk') html += riskSheet()
  if (S.sheet === 'lock') html += lockSheet()
  $screen.innerHTML = html
  const sc = $screen.querySelector('.scroll'); if (sc && !scrollTop) sc.scrollTop = y
  renderToast()
  if (S.screen === 'result' && S.result && !S.result.animated) animateXp()
}
function renderToast() {
  let t = $app.querySelector('.toast')
  if (!S.toast) { if (t) t.remove(); return }
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); $app.appendChild(t) }
  t.innerHTML = S.toast
}
function animateXp() {
  S.result.animated = true
  const el = document.getElementById('xp-count'), to = S.result.xp, t0 = performance.now()
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const step = now => { const k = reduce ? 1 : Math.min(1, (now - t0) / 900); if (el) el.textContent = '+' + Math.round(to * k); if (k < 1) requestAnimationFrame(step) }
  requestAnimationFrame(step)
  setTimeout(() => { if (el) el.textContent = '+' + to }, 1000) // por si la pestaña está en segundo plano
}

/* ── Lógica de acciones ──────────────────────────── */
function completeGoal(id) {
  const g = S.goals.find(x => x.id === id)
  if (!g || g.progress >= g.target) return false
  g.progress++
  if (g.progress >= g.target) { S.xp += g.xp; S.league += g.xp; return true }
  return false
}
function markActive() {
  if (S.todayDone) return false
  S.todayDone = true; S.streak++; if (S.streak > S.best) S.best = S.streak; return true
}
function finishQuiz() {
  const correct = S.answers.filter(Boolean).length, total = QUIZ.length, perfect = correct === total
  const secs = Math.max(40, Math.round((Date.now() - S.quizStart) / 1000))
  const base = correct * 10, xp = base + (perfect ? Math.round(base * .5) : 0) + (secs / total < 15 ? Math.round(base * .1) : 0)
  const before = level().n
  S.xp += xp; S.league += xp
  const goals = []
  if (completeGoal('clase')) goals.push('Completa una clase')
  if (perfect && completeGoal('perfect')) goals.push('Quiz perfecto')
  const extended = markActive()
  const stars = perfect ? 3 : correct / total >= .75 ? 2 : 1
  S.lessons[3] = { st: 'done', stars }; if (S.lessons[4].st === 'locked') S.lessons[4] = { st: 'open', stars: 0 }
  const after = level().n
  S.result = { correct, total, perfect, stars, xp, time: Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'), goals, extended, levelUp: after > before ? after : null }
  go('result')
}
function executeOrder(ack) {
  const o = S.order, a = A[o.sym], pv = preview(), now = new Date()
  const time = now.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' · ' + now.toLocaleTimeString('es-ES')
  if (!a.open) {
    S.pending = S.pending || []
    S.pending.push({ label: `Mercado · ${o.side === 'BUY' ? 'Comprar' : 'Vender'} ${a.s}`, desc: `${eur(pv.amt)} al abrir el mercado` })
    S.filled = { pending: true, side: o.side, sym: a.s, qty: pv.qty, price: pv.price, fee: pv.f, total: o.side === 'BUY' ? pv.amt : pv.amt, time }
    S.order = null; go('filled'); return
  }
  let pnl = null
  const first = !S.firstTradeDone
  if (o.side === 'BUY') {
    const p = S.pos[a.s] || { qty: 0, avg: 0 }, qty = p.qty + pv.qty
    S.pos[a.s] = { qty, avg: (p.qty * p.avg + pv.qty * pv.price) / qty }
    S.cash -= pv.amt
    S.trades.unshift({ t: 'Compra', s: a.s, d: 'Hoy ' + now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }), total: pv.amt })
  } else {
    const p = S.pos[a.s]; pnl = pv.qty * (pv.price - p.avg) - pv.f
    p.qty -= pv.qty; if (p.qty < 1e-7) delete S.pos[a.s]
    S.cash += pv.amt; S.realized += pnl
    S.trades.unshift({ t: 'Venta', s: a.s, d: 'Hoy', total: pv.amt, pnl })
  }
  S.firstTradeDone = true
  const goal = completeGoal('ops')
  markActive()
  S.xp += 15; S.league += 15
  S.filled = { side: o.side, sym: a.s, qty: pv.qty, price: pv.price, fee: pv.f, total: o.side === 'BUY' ? pv.amt : pv.amt, pnl, time, xp: 15, goal, first, ack }
  S.order = null; go('filled')
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-candle], [data-act]')
  if (!t || !document.getElementById('app').contains(t)) return
  const d = t.dataset
  if (d.candle !== undefined && S.screen === 'lesson') { S.tapped = +d.candle; render(); return }
  if (d.go) {
    if (d.resetPl) { S.plQi = 0; S.plPick = null; S.plScore = 0 }
    if (d.skip) { toast('Has entrado como Laura (datos de ejemplo)') }
    go(d.go); return
  }
  if (d.gender) { S.gender = d.gender; render(); return }
  if (d.exp) { S.exp = d.exp; render(); return }
  if (d.goal) { S.goalsSel = S.goalsSel.includes(d.goal) ? S.goalsSel.filter(g => g !== d.goal) : [...S.goalsSel, d.goal]; render(); return }
  if (d.meta) { S.meta = +d.meta; render(); return }
  if (d.pl !== undefined) { S.plPick = +d.pl; render(); return }
  if (d.skin) { S.skin = d.skin; render(); return }
  if (d.pick !== undefined && S.picked === null) {
    const Q = QUIZ[S.qi]; S.picked = +d.pick
    const ok = S.picked === Q.c; S.answers[S.qi] = ok
    if (!ok && !S.premium) S.lives = Math.max(0, S.lives - 1)
    render(); return
  }
  if (d.filter) { S.mFilter = d.filter; S.mQuery = ''; render(); return }
  if (d.asset) { go('asset', { asset: d.asset, chartInt: '1d', chartMode: 'Línea' }); return }
  if (d.cmode) { S.chartMode = d.cmode; render(); return }
  if (d.cint) { S.chartInt = d.cint; render(); return }
  if (d.ptab) { S.pTab = d.ptab; render(); return }
  if (d.prange) { S.pRange = d.prange; render(); return }
  if (d.amt) { S.order.amount = +d.amt; render(); return }
  if (d.sellpct) { S.order.pctSell = +d.sellpct; render(); return }
  if (d.otype) { if (d.locked === 'true') { S.sheet = 'lock'; render(); return } S.order.type = d.otype; render(); return }
  if (d.plan) { S.plan = d.plan; render(); return }
  if (d.themeSet) { S.theme = d.themeSet; render(); return }
  if (d.notif) { S.notif[d.notif] = !S.notif[d.notif]; render(); return }
  if (d.cancel !== undefined) { S.pending.splice(+d.cancel, 1); toast('Orden cancelada'); render(); return }

  switch (d.act) {
    case 'back': go(onbBack[S.screen] || backTarget[S.screen] || 'home'); break
    case 'onb1-next': { const v = document.getElementById('f-name').value.trim(); if (v) S.name = v; go('onb2'); break }
    case 'pl-next': case 'pl-skip':
      if (d.act === 'pl-next' && S.plPick === PLACEMENT[S.plQi].c) S.plScore = (S.plScore || 0) + 1
      if (S.plQi < PLACEMENT.length - 1) { S.plQi++; S.plPick = null; render(true) } else go('placeres')
      break
    case 'onb5-next': { const v = document.getElementById('f-lumi').value.trim(); S.lumiName = v || 'Lumi'; go('onb6'); break }
    case 'disclaimer': S.disclaimer = !S.disclaimer; render(); break
    case 'start': if (S.premium && !S.bonusGiven) { S.cash += 40000; S.bonusGiven = true } go('home'); toast(`¡Bienvenida a bordo! Tienes ${S.premium ? '50.000' : '10.000'} € virtuales.`.replace('Bienvenida', S.gender === 'M' ? 'Bienvenido' : S.gender === 'N' ? 'Te damos la bienvenida' : 'Bienvenida')); break
    case 'gems': toast(`${gem(14)} Tienes ${S.gems} gemas. Se ganan con logros y objetivos.`); break
    case 'lives': if (S.premium) toast('Con Premium tus vidas son ilimitadas.'); else if (S.lives === 0) go('nolives'); else toast(`${heart(14)} ${S.lives} de 5 vidas · 1 nueva cada 4 h`); break
    case 'open-lesson': if (S.lives === 0 && !S.premium) { go('nolives'); break } if (+d.n !== 3 && S.lessons[+d.n].st === 'done') { toast('En la demo, la lección para probar es «Velas japonesas».'); break } if (+d.n !== 3) { toast('En la demo, la lección para probar es «Velas japonesas».'); break } go('lesson', { step: 0, tapped: null }); break
    case 'locked-lesson': toast('Se desbloquea al completar la lección anterior.'); break
    case 'lesson-next': S.step++; render(true); break
    case 'start-quiz': go('quiz', { qi: 0, picked: null, answers: [], quizStart: Date.now() }); break
    case 'quiz-next':
      if (S.lives === 0 && !S.premium && S.picked !== QUIZ[S.qi].c) { go('nolives'); break }
      if (S.qi < QUIZ.length - 1) { S.qi++; S.picked = null; render(true) } else finishQuiz()
      break
    case 'refill': S.gems -= 350; S.lives = 5; toast('Vidas recargadas'); go('path'); break
    case 'review': toast('Repaso de fallos: practicas sin perder vidas'); go('path'); break
    case 'follow': S.watch = S.watch.includes(S.asset) ? S.watch.filter(s => s !== S.asset) : [...S.watch, S.asset]; toast(S.watch.includes(S.asset) ? 'Añadido a Seguimiento' : 'Quitado de Seguimiento'); render(); break
    case 'alert': toast(`Alerta creada: te avisamos si ${A[S.asset].n} baja un 5 %`); break
    case 'order': {
      if (d.side === 'BUY' && S.stale) { toast('Esperando precio actualizado para operar…'); break }
      S.order = { sym: S.asset, side: d.side, type: 'MARKET', amount: Math.min(1500, Math.floor(S.cash / 10) * 10), pctSell: 50 }
      S.sheet = 'order'; render(); break
    }
    case 'close-sheet': S.sheet = S.order ? (S.sheet === 'lock' ? 'order' : null) : null; if (!S.sheet) S.order = null; render(); break
    case 'review-order': { const pv = preview(); if (pv.flagged && S.order.side === 'BUY') { S.sheet = 'risk'; render() } else executeOrder(false); break }
    case 'lower': S.order.amount = +d.to; S.sheet = 'order'; render(); break
    case 'confirm-order': executeOrder(true); break
    case 'buy-freeze': if (S.gems >= 200) { S.gems -= 200; S.freezes++; toast('Protector comprado'); render() } else toast('Necesitas 200 gemas'); break
    case 'read-all': S.notifRead = true; render(); break
    case 'buy-premium': setPremium(true); go('premiumok'); break
    case 'ask-reset': S.confirmReset = true; render(); break
    case 'cancel-reset': S.confirmReset = false; render(); break
    case 'do-reset': S.pos = {}; S.cash = S.premium ? 50000 : 10000; S.realized = 0; S.resetsLeft--; S.confirmReset = false; toast('Cartera reiniciada. Conservas XP, racha y logros.'); render(); break
    case 'logout': { const th = S.theme; S = fresh(); S.theme = th; go('welcome'); break }
  }
})

document.addEventListener('input', e => {
  if (e.target.id === 'm-search') {
    S.mQuery = e.target.value
    const list = S.mQuery ? ASSETS.filter(a => (a.n + a.s).toLowerCase().includes(S.mQuery.toLowerCase())) : (S.mFilter === 'Seguimiento' ? S.watch.map(s => A[s]) : ASSETS.filter(a => a.type === S.mFilter))
    document.getElementById('m-list').innerHTML = list.length ? list.map(assetRow).join('') : '<div class="li t-foot">No hay activos con ese nombre.</div>'
  }
  if (e.target.id === 'o-range' && S.order) {
    S.order.amount = +e.target.value
    const pv = preview(), a = A[S.order.sym]
    document.getElementById('o-amt').textContent = n0.format(S.order.amount) + ' €'
    document.getElementById('o-qty').textContent = `≈ ${n2.format(pv.qty)} ${a.type === 'Cripto' ? a.s : 'acciones'} a ${eur(pv.price)}`
    document.getElementById('o-preview').innerHTML = previewRows(pv, true)
    $screen.querySelectorAll('[data-amt]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.amt === S.order.amount))
  }
})

/* ── Precios que se mueven (solo en la demo) ─────── */
setInterval(() => {
  if (S.stale) return
  for (const a of ASSETS) {
    if (!a.open) continue
    const old = a.p, drift = (Math.random() - .5) * (a.fx ? .0004 : a.h24 ? .004 : .002)
    a.p = Math.max(.0001, a.p * (1 + drift)); a.c += drift * 100
    $screen.querySelectorAll(`[data-px="${a.s}"]`).forEach(el => {
      el.textContent = fprice(a); el.classList.remove('flash-up', 'flash-down'); void el.offsetWidth; el.classList.add(a.p >= old ? 'flash-up' : 'flash-down')
    })
    $screen.querySelectorAll(`[data-chg="${a.s}"]`).forEach(el => {
      if (S.screen === 'asset') { const ch = a.p - a.p / (1 + a.c / 100); el.textContent = `${a.c >= 0 ? '▲ +' : '▼ −'}${n2.format(Math.abs(ch))} (${n2.format(Math.abs(a.c))} %) hoy` } else el.textContent = pct(a.c)
      el.classList.toggle('up', a.c >= 0); el.classList.toggle('down', a.c < 0)
    })
  }
  $screen.querySelectorAll('[data-total]').forEach(el => { el.textContent = eur(total()) })
  $screen.querySelectorAll('[data-daychg]').forEach(el => { const v = dayChange(); el.textContent = `${v >= 0 ? '▲' : '▼'} ${sEur(v)} hoy`; el.classList.toggle('up', v >= 0); el.classList.toggle('down', v < 0) })
}, 2500)

/* Cuenta atrás de vidas */
let regen = 3 * 3600 + 24 * 60 + 10
setInterval(() => { regen = Math.max(0, regen - 1); const el = document.getElementById('regen'); if (el) el.textContent = `${Math.floor(regen / 3600)}:${String(Math.floor(regen % 3600 / 60)).padStart(2, '0')}:${String(regen % 60).padStart(2, '0')}` }, 1000)

function setPremium(on) {
  S.premium = on
  if (on && !S.bonusGiven && S.screen !== 'onb6') { S.cash += 40000; S.bonusGiven = true }
}

render(true)
})()
